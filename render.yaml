# Render Blueprint: the API and a Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
# The frontend is deployed separately on Vercel (see frontend/vercel.json and README).
services:
  - type: web
    name: white-lotus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (no-op when up to date); the seed only
    # inserts sample listings when the table is empty.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: white-lotus-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true # Render creates a random key; copy it from the dashboard
      - key: CORS_ORIGINS
        sync: false # set to the Vercel URL, e.g. https://white-lotus.vercel.app

databases:
  - name: white-lotus-db
    plan: free
    databaseName: whitelotus
    user: whitelotus
